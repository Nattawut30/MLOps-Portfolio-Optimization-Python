[tool.poetry]
name = "port-optimization-mlops-python"
version = "0.1.0"
description = "MLOps portfolio optimization: Black-Litterman, risk parity, Brownian Motion, Heston, FFT."
authors = ["Nattawut30"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
streamlit = "^1.60.0"
pandas = "<3.0.0"
plotly = "^6.9.0"
pyarrow = "<25.0.0"
requests = "^2.34.2"

[tool.poetry.group.pipeline]
optional = true

[tool.poetry.group.pipeline.dependencies]
numpy = "^2.5.1"
scikit-learn = "^1.9.0"
torch = "^2.13.0"
scipy = "^1.18.0"
mlflow = "^3.15.0"
pydantic-settings = "^2.14.2"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "ruff (>=0.16.1,<0.17.0)",
    "black (>=26.5.1,<27.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "pandas-stubs",
    "scipy-stubs"
]

[tool.mypy]
[[tool.mypy.overrides]]
module = ["sklearn.*", "plotly.*"]
ignore_missing_imports = true
