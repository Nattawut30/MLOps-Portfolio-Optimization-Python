name: Monthly Pipeline

on:
  schedule:
    - cron: "0 6 1,16 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --with pipeline

      - name: Run pipeline
        run: |
          for attempt in 1 2 3; do
            poetry run python -m src.pipeline && break
            if [ "$attempt" -eq 3 ]; then
              echo "Pipeline failed after 3 full attempts."
              exit 1
            fi
            echo "Attempt $attempt failed — retrying in 2 minutes..."
            sleep 120
          done

      - name: Publish results to the "latest" release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            data/02_silver/expected_returns.parquet \
            data/03_gold/weights.parquet \
            data/03_gold/risk_metrics.parquet \
            data/03_gold/simulation_terminal_values.parquet \
            data/03_gold/heston_hedge.parquet \
            data/03_gold/run_summary.parquet \
            --title "Latest pipeline run" \
            --notes "Automated data refresh: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Heartbeat (keeps schedule alive — never touches main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B automation-heartbeat
          echo "Last automated run: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > .heartbeat
          git add .heartbeat
          git commit -m "Heartbeat: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force origin automation-heartbeat
