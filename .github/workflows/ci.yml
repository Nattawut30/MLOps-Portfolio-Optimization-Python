name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Every module transitively imports settings.py, which requires a
      # non-empty key just to instantiate. Tests never make a real network
      # call, extractor tests use fakes and monkeypatched responses, so
      # this only needs to be non-empty, not a real key.
      ALPHA_VANTAGE_API_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --with pipeline

      - name: Lint
        run: poetry run ruff check .

      - name: Type check
        run: poetry run mypy src/

      - name: Test
        run: poetry run pytest -v
